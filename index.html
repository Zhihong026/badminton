<script>
  // 部分瀏覽器(尤其新版 iOS Safari)基於無障礙考量會忽略 viewport 的 user-scalable=no，
  // 因此額外用 JS 攔截手勢縮放與雙擊縮放，確保頁面真的無法被縮放。
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
  document.addEventListener('gestureend', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length > 1) { e.preventDefault(); }
  }, { passive: false });
  let __lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    const now = Date.now();
    if (now - __lastTouchEnd <= 300) { e.preventDefault(); }
    __lastTouchEnd = now;
  }, { passive: false });
</script>

  // ===== 畫面內建除錯訊息欄 =====
  // 完全獨立於 React 之外的純 JS，就算 React 整個崩潰，這層還是能顯示錯誤內容，
  // 讓使用者不需要開瀏覽器 Console 也能看到、回報發生了什麼錯誤。
  function __showDebugOverlay(text) {
    var el = document.getElementById('__debug_overlay__');
    if (!el) {
      el = document.createElement('div');
      el.id = '__debug_overlay__';
      el.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:45vh;overflow:auto;background:rgba(20,0,0,0.95);color:#ffb4b4;font-family:monospace;font-size:11px;padding:8px;z-index:2147483647;white-space:pre-wrap;border-top:2px solid #ff4444;';
      var closeBtn = document.createElement('button');
      closeBtn.textContent = '關閉除錯欄 ✕';
      closeBtn.style.cssText = 'position:sticky;top:0;display:block;margin-bottom:6px;background:#ff4444;color:#fff;border:none;padding:4px 10px;border-radius:4px;font-size:11px;';
      closeBtn.onclick = function () { el.remove(); };
      el.appendChild(closeBtn);
      document.body.appendChild(el);
    }
    var line = document.createElement('div');
    line.style.cssText = 'border-bottom:1px solid #442222;padding:4px 0;';
    line.textContent = new Date().toLocaleTimeString() + ' — ' + text;
    el.appendChild(line);
  }
  window.addEventListener('error', function (event) {
    var msg = (event.error && (event.error.stack || event.error.message)) || event.message || '未知錯誤';
    var loc = event.filename ? `\n來源: ${event.filename}:${event.lineno}:${event.colno}` : '';
    __showDebugOverlay('JS 錯誤：' + msg + loc);
  });
  window.addEventListener('unhandledrejection', function (event) {
    var reason = event.reason;
    var msg = (reason && (reason.stack || reason.message)) || String(reason);
    __showDebugOverlay('未處理的 Promise 錯誤：' + msg);
  });
</script>

// 新增球員、修改球員等級、修改球員狀態、刪除球員、清空球員名單、清空歷史紀錄、調整規則設定。

    // 要求「✅」後面接的文字很短（例如場次代號「0030」），且緊接著下一行就是編號名單開頭，
    // 才視為這種簽到表格式；避免一般文字裡的「✅」項目符號（例如「✅五級以上球友歡迎報名」）被誤判。
    let signupConfirmedMatch = remaining.match(/✅([^\n]*)\n([\s\S]*?)(?=⏳|(?:^|\n)\s*候補|$)/);
    if (signupConfirmedMatch) {
        const headerRest = signupConfirmedMatch[1].trim();
        const looksLikeSignupHeader = headerRest.length <= 12 && /^\s*\d+[\.\、]/.test(signupConfirmedMatch[2].trim());
        if (!looksLikeSignupHeader) {
            signupConfirmedMatch = null;
        }
    }
    if (signupConfirmedMatch) {
        const block = signupConfirmedMatch[2];
        const nameLines = block.match(/^[ \t]*\d+[\.\、][ \t]*(.+)$/gm) || [];
        const confirmedNames = nameLines
            .map(line => {
                const m = line.match(/^[ \t]*\d+[\.\、][ \t]*(.+)$/);
                return m ? m[1].trim() : null;
            })
            .filter(Boolean);
        if (confirmedNames.length > 0) {

        // 這樣才能正確反映「這個時段定義出現在哪個名單前面，就套用給那個名單」。
        const sessionTimeMap = {};
        const sessionDefRegex = /[\(（]([A-Za-z])[\)）]\s*(?:時段)?\s*(\d{1,2}):?(\d{2})\s*[-~至]\s*(\d{1,2}):?(\d{2})/g;
        const sessionDefEvents = [];
        let sdm;
        while ((sdm = sessionDefRegex.exec(remaining)) !== null) {
            const key = sdm[1].toUpperCase();
            const info = {
                text: `${sdm[2]}:${sdm[3]}-${sdm[4]}:${sdm[5]}`,
                hours: computeSpanHours(parseInt(sdm[2], 10), parseInt(sdm[3], 10), parseInt(sdm[4], 10), parseInt(sdm[5], 10)),
            };
            sessionTimeMap[key] = info;
            sessionDefEvents.push({ index: sdm.index, len: sdm[0].length, info });
        }
        // 如果有偵測到帶代號的時段定義（例如C/D），沒有自己標時段代號的球友，
        // 就用時數最長（涵蓋範圍最廣）的那個時段當作「一開始」的預設值，避免完全不設定時段；
        // 實際掃描到個別時段標記時，還是會依序更新成正確的時段
        const sessionKeys = Object.keys(sessionTimeMap);
        if (sessionKeys.length > 0 && !scanDefaultTime) {
            const widestKey = sessionKeys.reduce((best, k) => (sessionTimeMap[k].hours > sessionTimeMap[best].hours ? k : best), sessionKeys[0]);
            scanDefaultTime = sessionTimeMap[widestKey].text;
            scanDefaultHours = sessionTimeMap[widestKey].hours;
        }
        const events = [];
        sessionDefEvents.forEach(sde => {
            events.push({ type: 'sessionDef', index: sde.index, len: sde.len, info: sde.info });
        });
        const markerRegex = /^[ \t]*[\(（]?-[\)）]?\s*(?:(\d{1,2}):?(\d{2})\s*[-~至]\s*(\d{1,2}):?(\d{2}))?\s*[\(（]?-[\)）]?\s*$/gm;
        let mm;
        while ((mm = markerRegex.exec(remaining)) !== null) {
            if (mm[0].trim() === '')
                continue;
            events.push({ type: 'marker', index: mm.index, m: mm });
        }
        const blockRegex = /(?:^|\n)([ \t]*\d+[\.\、][^\n]*(?:\n[ \t]*\d+[\.\、][^\n]*)*)/gm;
        let bm;
        while ((bm = blockRegex.exec(remaining)) !== null) {
            events.push({ type: 'block', index: bm.index, m: bm });
        }
        // 「A：9-12」「B：12-15」這種用單一字母＋冒號＋起訖小時表示時段代號的寫法，
        // 出現時一樣視為「目前預設時段」更新（跟(-)標記邏輯相同），只是時間只有到小時、沒有分鐘
        const letterMarkerRegex = /\b([A-Za-z])[:：]\s*(\d{1,2})\s*[-~至]\s*(\d{1,2})(?![:：\d])/g;
        let ltm;
        while ((ltm = letterMarkerRegex.exec(remaining)) !== null) {
            events.push({ type: 'letterMarker', index: ltm.index, m: ltm });
        }
        events.sort((a, b) => a.index - b.index);
        const extractedNames = [];
        const consumedRanges = [];
        events.forEach(ev => {
            if (ev.type === 'sessionDef') {
                scanDefaultTime = ev.info.text;
                scanDefaultHours = ev.info.hours;
                consumedRanges.push([ev.index, ev.index + ev.len]);
            }
            else if (ev.type === 'letterMarker') {
                const h1 = parseInt(ev.m[2], 10);
                const h2 = parseInt(ev.m[3], 10);
                scanDefaultTime = `${String(h1).padStart(2, '0')}:00-${String(h2).padStart(2, '0')}:00`;
                scanDefaultHours = computeSpanHours(h1, 0, h2, 0);
                consumedRanges.push([ev.index, ev.index + ev.m[0].length]);
            }
            else if (ev.type === 'marker') {
                const em = ev.m;
                if (em[1] !== undefined) {
                    scanDefaultTime = `${em[1]}:${em[2]}-${em[3]}:${em[4]}`;
                    scanDefaultHours = computeSpanHours(parseInt(em[1], 10), parseInt(em[2], 10), parseInt(em[3], 10), parseInt(em[4], 10));
                }
                else if (overallTimeMatch) {
                    scanDefaultTime = `${overallTimeMatch[1]}:${overallTimeMatch[2]}-${overallTimeMatch[3]}:${overallTimeMatch[4]}`;
                    scanDefaultHours = computeSpanHours(parseInt(overallTimeMatch[1], 10), parseInt(overallTimeMatch[2], 10), parseInt(overallTimeMatch[3], 10), parseInt(overallTimeMatch[4], 10));
                }
                else {
                    scanDefaultTime = undefined;
                    scanDefaultHours = undefined;
                }
                consumedRanges.push([ev.index, ev.index + ev.m[0].length]);
            }
            else {
                const lines = ev.m[1].split('\n');
                let foundAny = false;
                lines.forEach(line => {
                    const lm = line.match(/^[ \t]*\d+[\.\、][ \t]*(.*)$/);
                    if (!lm)
                        return;
                    let content = lm[1].trim();
                    if (!content)
                        return;
                    foundAny = true;
                    // 常見表情符號清理：「🆎」這類直接黏在姓名跟級數中間的符號視為分隔符號(等同空白)，
                    // 其餘常見裝飾用表情符號（🈵、💖、🔥、❤️等）直接移除，避免干擾姓名/級數判斷
                    content = content.replace(/🆎/g, ' ').replace(/[💖🔥❤️🈵✨⭐️👍🏻]/g, '').replace(/\s+/g, ' ').trim();
                    // 個人專屬時段標註，例如「（1830-2130）」「（19-22）」，有的話優先於整批的預設時段
                    let personalTime;
                    let personalHours;
                    const timeAnnotation = content.match(/[\(（]\s*(\d{1,2}):?(\d{2})?\s*[-~至]\s*(\d{1,2}):?(\d{2})?\s*[\)）]\s*$/);
                    if (timeAnnotation) {
                        const h1 = parseInt(timeAnnotation[1], 10);
                        const m1 = timeAnnotation[2] !== undefined ? parseInt(timeAnnotation[2], 10) : 0;
                        const h2 = parseInt(timeAnnotation[3], 10);
                        const m2 = timeAnnotation[4] !== undefined ? parseInt(timeAnnotation[4], 10) : 0;
                        personalTime = `${String(h1).padStart(2, '0')}:${String(m1).padStart(2, '0')}-${String(h2).padStart(2, '0')}:${String(m2).padStart(2, '0')}`;
                        personalHours = computeSpanHours(h1, m1, h2, m2);
                        content = content.slice(0, timeAnnotation.index).trim();
                    }
                    // 名字結尾標註的時段代號，例如「之怡/C」「之泰/6/C」的最後一段 C，
                    // 對應到前面偵測到的 (C)/(D) 時段定義；優先度低於個人專屬時間標註，高於整批預設時段
                    let sessionKeyTime;
                    let sessionKeyHours;
                    const sessionKeyMatch = content.match(/\/([A-Za-z]{1,2})$/);
                    if (sessionKeyMatch && sessionTimeMap[sessionKeyMatch[1].toUpperCase()]) {
                        const info = sessionTimeMap[sessionKeyMatch[1].toUpperCase()];
                        sessionKeyTime = info.text;
                        sessionKeyHours = info.hours;
                        content = content.slice(0, sessionKeyMatch.index).trim();
                    }
                    // 姓名/級數：分隔符號支援空白、斜線、破折號、冒號，級數允許帶「+」（例如「漢堡/5+」），
                    // 也支援級數用範圍表示（例如「Lucy/4-5」，取範圍中較低的數字），
                    // 以及級數前面直接用「L」標示（例如「Pink L6」「阿愷L5」，後者姓名跟L之間沒有分隔符號也要能辨識）
                    content = content.replace(/([^\s\/\-－:：])[Ll](\d)/, '$1 L$2');
                    const withLevel = content.match(/^(.+?)[\s\/\-－:：]+[Ll](?:[Vv]\.?)?\s*(\d{1,2})(?:-\d{1,2})?\+?\s*(?:級)?$/) ||
                        content.match(/^(.+?)[\s\/\-－:：]+(\d{1,2})(?:-\d{1,2})?\+?\s*(?:級|LV\.?|Lv\.?)?$/) ||
                        content.match(/^([^\d]+?)(\d{1,2})(?:-\d{1,2})?\+?\s*(?:級|LV\.?|Lv\.?)?$/);
                    let name;
                    let level;
                    let levelIsDefault;
                    if (withLevel && withLevel[1].trim()) {
                        name = withLevel[1].trim();
                        level = Math.min(15, Math.max(1, parseInt(withLevel[2], 10)));
                    }
                    else {
                        name = content;
                        level = 6;
                        levelIsDefault = true;
                    }
                    // 姓名結尾若還帶著跟時段/級數無關的備註括號（例如「妃妃(love card)」），清掉讓名字乾淨一點
                    name = name.replace(/[\(（][^()（）]*[\)）]\s*$/, '').trim();
                    if (!name)
                        return;
                    extractedNames.push({
                        name,
                        level,
                        levelIsDefault,
                        sessionTime: personalTime || sessionKeyTime || scanDefaultTime,
                        plannedHours: personalHours !== undefined ? personalHours : (sessionKeyHours !== undefined ? sessionKeyHours : scanDefaultHours),
                    });
                });
                if (foundAny) {
                    consumedRanges.push([ev.index, ev.index + ev.m[0].length]);
                }
            }
        });
        if (extractedNames.length >= 3) {
            // 跨時段同名合併：如果同一個人（姓名相同，不分大小寫）出現在好幾個時段的名單裡，
            // 代表他每個時段都有報名，合併成一筆資料就好，打球時段改成涵蓋所有出現時段的完整區間
            const mergedMap = new Map();
            const mergedOrder = [];
            const parseTimeRange = (s) => {
                const m = s && s.match(/(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})/);
                return m ? { start: parseInt(m[1], 10) * 60 + parseInt(m[2], 10), end: parseInt(m[3], 10) * 60 + parseInt(m[4], 10) } : null;
            };
            extractedNames.forEach(item => {
                const key = item.name.trim().toLowerCase();
                if (!mergedMap.has(key)) {
                    mergedMap.set(key, { ...item });
                    mergedOrder.push(key);
                    return;
                }
                const existing = mergedMap.get(key);
                // 級數：優先採用有明確標示的那一筆
                if (existing.levelIsDefault && !item.levelIsDefault) {
                    existing.level = item.level;
                    existing.levelIsDefault = false;
                }
                // 打球時段：合併成「最早開始～最晚結束」的完整區間
                if (item.sessionTime) {
                    if (!existing.sessionTime) {
                        existing.sessionTime = item.sessionTime;
                        existing.plannedHours = item.plannedHours;
                    }
                    else {
                        const r1 = parseTimeRange(existing.sessionTime);
                        const r2 = parseTimeRange(item.sessionTime);
                        if (r1 && r2) {
                            const startMin = Math.min(r1.start, r2.start);
                            const endMin = Math.max(r1.end, r2.end);
                            existing.sessionTime = `${String(Math.floor(startMin / 60)).padStart(2, '0')}:${String(startMin % 60).padStart(2, '0')}-${String(Math.floor(endMin / 60)).padStart(2, '0')}:${String(endMin % 60).padStart(2, '0')}`;
                            existing.plannedHours = Math.round(((endMin - startMin) / 60) * 2) / 2;
                        }
                    }
                }
            });
            const mergedNames = mergedOrder.map(k => mergedMap.get(k));
            mergedNames.forEach(n => result.addPlayers.push(n));
            structuredListFound = true;
            // 場地數量：這種格式沒特別講的話，一樣依「合併後的實際人數」自動估算（每 8 人一場），
            // 若文字裡另外有明確指定場地數，後面「規則設定」那段會覆蓋掉這個估算值
            result.ruleUpdates.courtCount = Math.min(8, Math.max(1, Math.ceil(mergedNames.length / 8)));
            result.courtCountAuto = true;
            if (overallTimeMatch) {
                remaining = remaining.replace(overallTimeMatch[0], ' ');
            }
            // 由後往前移除已處理的區段，避免文字位移造成錯位
            consumedRanges.sort((a, b) => b[0] - a[0]).forEach(([s, e]) => {
                remaining = remaining.slice(0, s) + ' ' + remaining.slice(e);
            });
        }
    }
    // ---- 1. 破壞性 / 特殊指令（優先辨識，辨識到就從文字中移除，避免被後面的規則誤判） ----
    // 「全部清空」「幫我全部清空」這種沒有指定特定對象的清空指令 → 排場、球員名單、歷史紀錄三個一起清
    if (/全部清空|清空全部|清除全部|全部清除/.test(remaining)) {
        result.clearHistory = true;
        result.clearCourts = true;
        result.clearAllPlayers = true;
        remaining = remaining.replace(/全部清空|清空全部|清除全部|全部清除/g, ' ');
    }
    // 以「清空/清除」開頭到該行/該句結束為一個子句一起判斷，這樣「清空排場跟歷史紀錄」這種
    // 一次提到多個對象的組合句也能同時辨識出「清空排場」+「清空歷史紀錄」兩件事。
    remaining = remaining.replace(/清[空除][^\n。，,]*/g, (whole) => {
        if (/(?:歷史)?(?:對戰)?紀錄/.test(whole)) {
            result.clearHistory = true;
        }
        if (/排場|場地|場上|對戰狀態/.test(whole)) {
            result.clearCourts = true;
        }
        if (/(?:所有)?球員(?:名單)?|名單/.test(whole)) {
            result.clearAllPlayers = true;
        }
        return ' ';
    });
    if (/刪除所有球員/.test(remaining)) {
        result.clearAllPlayers = true;
        remaining = remaining.replace(/刪除所有球員/g, ' ');
    }
    // ---- 2. 刪除特定球員：「刪除OOO」「移除OOO、XXX」「OOO刪除」 ----
    remaining = remaining.replace(/(?:刪除|移除)\s*([\u4e00-\u9fa5A-Za-z、,，\s]+?)(?=[\n。]|$)/g, (whole, namesRaw) => {
        namesRaw.split(/[、,，\s]+/).map(s => s.trim()).filter(Boolean).forEach(n => result.deletePlayers.push(n));
        return ' ';
    });
    // 「球員刪除」：名字在前、關鍵字在後，一樣支援多個名字用空白/頓號/逗號分隔
    remaining = remaining.replace(/(?:^|\n)[ \t]*([\u4e00-\u9fa5A-Za-z]{1,8}(?:[ \t、,，]+[\u4e00-\u9fa5A-Za-z]{1,8})*)[ \t]*(?:刪除|移除)/g, (whole, namesRaw) => {
        namesRaw.split(/[ \t、,，]+/).map(s => s.trim()).filter(Boolean).forEach(n => result.deletePlayers.push(n));
        return ' ';
    });
    // ---- 2.5 球員綁定／解除綁定：「心怡跟家豪綁定」「綁定 心怡、家豪」「心怡 家豪 綁定」「心怡解除綁定」 ----
    remaining = remaining.replace(/([\u4e00-\u9fa5A-Za-z]{1,8})\s*(?:跟|和|與|、|,|，)\s*([\u4e00-\u9fa5A-Za-z]{1,8})\s*綁定/g, (whole, n1, n2) => {
        result.bindPairs.push({ name1: n1.trim(), name2: n2.trim() });
        return ' ';
    });
    // 「球員 球員 綁定」：兩個名字中間只用空白分隔，不需要「跟／和／與」這類連接詞
    remaining = remaining.replace(/([\u4e00-\u9fa5A-Za-z]{1,8})[ \t]+([\u4e00-\u9fa5A-Za-z]{1,8})\s*綁定/g, (whole, n1, n2) => {
        result.bindPairs.push({ name1: n1.trim(), name2: n2.trim() });
        return ' ';
    });
    remaining = remaining.replace(/綁定\s*([\u4e00-\u9fa5A-Za-z]{1,8})\s*(?:跟|和|與|、|,|，|\s)+\s*([\u4e00-\u9fa5A-Za-z]{1,8})/g, (whole, n1, n2) => {
        result.bindPairs.push({ name1: n1.trim(), name2: n2.trim() });
        return ' ';
    });
    remaining = remaining.replace(/([\u4e00-\u9fa5A-Za-z]{1,8})\s*(?:解除綁定|解綁)/g, (whole, n1) => {
        result.unbindPlayers.push(n1.trim());
        return ' ';
    });
    remaining = remaining.replace(/(?:解除|取消)\s*([\u4e00-\u9fa5A-Za-z]{1,8}?)\s*(?:的)?綁定/g, (whole, n1) => {
        result.unbindPlayers.push(n1.trim());
        return ' ';
    });
    // ---- 3. 修改球員等級：「OOO改成8級」「OOO級數改為8」「OOO改8級」 ----
    remaining = remaining.replace(/([\u4e00-\u9fa5A-Za-z]{1,8})(?:的)?(?:級數|等級)?改(?:成|為)?\s*(\d{1,2})\s*級?/g, (whole, name, lvl) => {
        const level = Math.min(15, Math.max(1, parseInt(lvl, 10)));
        result.updatePlayerLevels.push({ name: name.trim(), level });
        return ' ';
    });
    // ---- 4. 批次修改「全部球員」的狀態：「全部球員設為休息」「全部上場」「所有人備戰」----
    // 要放在「單一球員狀態」判斷之前，避免「全部球員」被誤判成球員姓名
    let bulkStatusChange = null;
    remaining = remaining.replace(/(?:全部|所有)(?:球員|人)?(?:都)?(?:設為|改為)?(休息中|休息|備戰|場下|上場|報到)/g, (whole, kw) => {
        bulkStatusChange = kw === '休息' || kw === '休息中' ? 'resting' : 'available';
        return ' ';
    });
    result.bulkStatusChange = bulkStatusChange;
    // ---- 5. 修改球員狀態：「OOO休息」「OOO設為休息中」「OOO備戰」「OOO上場」「OOO報到」 ----
    // 先處理「多個名字＋一個狀態」的情況，例如「心怡 家豪 報到」代表兩人都報到，
    // 要放在「單一名字」判斷之前，避免只有最後一個名字被抓到、前面的名字漏掉
    remaining = remaining.replace(/([\u4e00-\u9fa5A-Za-z]{1,8}(?:[ \t、,，]+[\u4e00-\u9fa5A-Za-z]{1,8})+)[ \t]*(?:都)?(?:設為|改為)?(休息中|休息|備戰|場下|上場|報到)/g, (whole, namesRaw, kw) => {
        const status = kw === '休息' || kw === '休息中' ? 'resting' : 'available';
        namesRaw.split(/[ \t、,，]+/).map(s => s.trim()).filter(Boolean).forEach(n => result.statusChanges.push({ name: n, status }));
        return ' ';
    });
    remaining = remaining.replace(/([\u4e00-\u9fa5A-Za-z]{1,8}?)(?:設為|改為)?(休息中|休息|備戰|場下|上場|報到)/g, (whole, name, kw) => {
        const status = kw === '休息' || kw === '休息中' ? 'resting' : 'available';
        result.statusChanges.push({ name: name.trim(), status });
        return ' ';
    });
    // ---- 6. 規則設定 ----
    // 支援中文數字（一、二、兩、三...）跟阿拉伯數字混用，例如「場地兩個」「場地兩片」
    const chineseNumMap = { 一: 1, 二: 2, 兩: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10 };
    const toArabicNum = (s) => (chineseNumMap[s] !== undefined ? chineseNumMap[s] : parseInt(s, 10));
    const numPattern = '(\\d+|[一二兩两三四五六七八九十])';
    // 場地數量若文字裡有明確指定，要能正確覆蓋掉前面依人數自動估算的結果，
    // 並清除「自動估算」標記，讓預覽畫面正確顯示這是使用者明確指定的、不是自動猜的
    let courtCountSetExplicitly = false;
    const setCourtCountExplicit = (regex) => {
        const m = remaining.match(regex);
        if (m) {
            const num = toArabicNum(m[1]);
            if (!isNaN(num)) {
                result.ruleUpdates.courtCount = Math.min(8, Math.max(1, num));
                result.courtCountAuto = false;
                courtCountSetExplicitly = true;
            }
            remaining = remaining.replace(m[0], ' ');
        }
    };
    setCourtCountExplicit(new RegExp('場地\\s*(?:數量?)?\\s*(?:設定|設為|改為|改成)?\\s*[:：]?\\s*' + numPattern + '\\s*(?:個|片|面)?'));
    // 也支援「數字在前」的說法，例如「5個場地」「三片場地」；
    // 但如果文字裡有「依人數」「看人數」這類字眼，代表是在講「場地數依人數決定」的規則說明，
    // 不是明確講死場地數（例如「一面場8人 依人數開面數」），這種情況就不套用明確指定、改用自動估算
    if (!courtCountSetExplicitly && !/依人數|看人數/.test(remaining)) {
        setCourtCountExplicit(new RegExp(numPattern + '\\s*(?:個|片|面)\\s*場地?'));
    }
    const extractSetting = (regex, key, min, max) => {
        const m = remaining.match(regex);
        if (m) {
            const num = toArabicNum(m[1]);
            if (!isNaN(num)) {
                result.ruleUpdates[key] = Math.min(max, Math.max(min, num));
            }
            remaining = remaining.replace(m[0], ' ');
        }
    };

// Firebase Realtime Database 讀回資料時，如果不是「從 0 開始連續」的鍵值，
// 會把原本存進去的陣列變成一般物件，導致後續 .map()/.filter() 等陣列方法直接報錯、讓畫面整個崩潰。
// 這裡統一做防呆轉換：物件就取 Object.values 轉回陣列，不是陣列也不是物件就視為無效資料。
function normalizeFirebaseArray(val) {
    if (Array.isArray(val)) {
        return val.filter(item => item !== null && item !== undefined);
    }
    if (val && typeof val === 'object') {
        return Object.values(val).filter(item => item !== null && item !== undefined);
    }
    return null;
}
// Firebase 還有另一個陷阱：court.teamA / court.teamB 如果兩個球員欄位都是 null（例如空場狀態），
// Firebase 會把整個 teamA/teamB 物件直接刪掉（因為裡面全部都是空值），讀回來的時候
// court.teamA 會整個變成 undefined，後續程式碼一讀 court.teamA.player1Id 就會直接崩潰。
// 這裡統一補回預設的空物件，確保 teamA/teamB 一定存在。
function normalizeCourtData(court) {
    return {
        ...court,
        teamA: court.teamA || { player1Id: null, player2Id: null },
        teamB: court.teamB || { player1Id: null, player2Id: null },
    };
}
